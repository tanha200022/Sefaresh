name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # در flet==0.24.1 دستور `flet build` داخل خود پکیج flet است
          # (پکیج جدای flet-cli از 0.25.0 به بعد وجود دارد)
          pip install -r requirements.txt
          flet --version

      - name: Ensure Persian font exists
        run: |
          mkdir -p assets/fonts
          if [ ! -f assets/fonts/Vazirmatn-Regular.ttf ]; then
            curl -fL -o assets/fonts/Vazirmatn-Regular.ttf \
              https://github.com/rastikerdar/vazirmatn/raw/master/fonts/ttf/Vazirmatn-Regular.ttf
          fi

      - name: Check code (syntax + import)
        run: |
          python -m py_compile main.py
          python -c "import main"

      - name: Accept Android licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build Android APK
        run: |
          flet build apk --verbose \
            --project "ansari_orders" \
            --org "com.ansari.orders" \
            --product "سفارش‌یار"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ansari-orders-apk
          path: build/apk/*.apk
          if-no-files-found: error
